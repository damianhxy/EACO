name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: mvn test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 17 is the minimum the pom targets; 21 is the current LTS.
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Run tests
        run: mvn -B test
